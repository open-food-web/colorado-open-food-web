<!doctype html>
<html lang="en" data-root=".">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Listing · Colorado Open Food Web </title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200;0,300;0,400;1,200&family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;1,300&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="assets/site.css">
</head>
<body data-page="directory.html">
<div id="site-header"></div>
<main id="main" class="wrap"><p style="padding:40px 0" class="muted">Loading…</p></main>
<div id="site-footer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="assets/app.js"></script>
<script>
(function(){
  "use strict";
  var esc = CP.esc, main = document.getElementById("main");
  var slug = new URLSearchParams(location.search).get("slug");
  var MODEL = null;
  // The farmers market's own page, for the market stops in "places to find them".
  function marketPage(p){
    if(!MODEL || !isMarket(p)) return null;
    for(var i=0;i<MODEL.recs.length;i++){ var x = MODEL.recs[i]; if(x.group === "market" && x.places.some(function(q){ return q.loc.id === p.loc.id; })) return x; }
    return null;
  }
  function titleHtml(p){ var m = marketPage(p), t = esc(p.title); return m ? '<a href="'+CP.recUrl(m)+'">'+t+'</a>' : t; }

  function fact(label, html){ return html ? '<div class="fact"><span class="ic">'+label+'</span><div>'+html+'</div></div>' : ""; }
  function phone(p){ return p ? '<a href="tel:'+esc(p.replace(/[^0-9+]/g,""))+'">'+esc(p)+'</a>' : ""; }
  function addr(p){
    var a = p.loc.address, c = p.loc.city;
    if(a && c && a.toLowerCase().indexOf(c.toLowerCase()) === -1) return a + ", " + c;
    return a || c || "";
  }
  // A home base is a place to list when it is pinned or the business states a way to visit; we never say that anyone may not drop in.
  function isVisitable(p){ return p.role !== "home_base" || (p.rec.visits && p.rec.visits.length) || p.rec.dropin === true || p.pin; }
  function isMarket(p){ return /market/i.test(p.title || "") || /market/i.test(p.loc.name || ""); }
  var used = {};   // places a "way" already shows, so the list under the map does not repeat them
  function line(p, label, noHours){
    used[p.id] = true;
    var named = p.title && p.title !== p.loc.address && p.title !== p.loc.city;
    return (named ? titleHtml(p) + (addr(p) ? ", " + esc(addr(p)) : "") : esc(addr(p))) + (p.hours && !noHours ? ' <span class="muted">· ' + esc(p.hours) + '</span>' : "") + ownPage(p, label)
      + (p.pin ? ' <span class="muted">·</span> ' + mapLinks(p) : "")
      + (p.unconfirmed && p.pin ? '<div class="faint">We haven\'t confirmed that they sell here yet.</div>' : "");
  }
  // The business's own page that says it sells here, so a visitor can check it for themselves.
  function ownPage(p, label){ return p.loc.confirm_url ? ' <span class="muted">· ' + CP.safeLink(p.loc.confirm_url, label || (p.pickup ? "Pickup info" : "More info")) + '</span>' : ""; }

  function ways(r){
    var raw = r.raw, ch = r.channels, out = [];
    // A note about pickup, delivery or shipping belongs with how to order, not under the farm stand.
    var noteIsOrder = /pick ?up|deliver|ship/i.test(raw.visit_note || "") && (ch.indexOf("online") !== -1 || ch.indexOf("pickup") !== -1);
    var orderNote = noteIsOrder ? '<div class="muted">' + esc(raw.visit_note) + '</div>' : "";
    function add(title, html){ out.push('<li><strong>'+esc(title)+'</strong>'+'<div>'+html+'</div></li>'); }
    // One line under the visit: their own note, unless it only repeats the hours.
    function visitExtra(hasHours){
      var note = raw.visit_note || "";
      var restates = hasHours && /\d\s*[-–]\s*\d|\d\s*(am|pm)/i.test(note);
      var bits = [];
      if(note && !restates && !noteIsOrder) bits.push(esc(note));
      return bits.length ? '<div class="muted">' + bits.join(" ") + '</div>' : "";
    }
    var markets = r.places.filter(function(p){ return p.pickup && isMarket(p); });
    var pickups = r.places.filter(function(p){ return p.pickup && !isMarket(p) && (p.pin || addr(p)); });
    var site = raw.website ? CP.safeLink(raw.website) : "";
    // Each way to visit, titled, with its own hours; the address and links appear once, on the first.
    if(r.group === "farm" && r.visits.length){
      var vp = r.places.filter(function(p){ return p.pin && p.role === "farm_stand"; })[0] || r.places.filter(function(p){ return p.pin && p.role === "home_base"; })[0];
      r.visits.forEach(function(v, k){
        add(v.label, (v.detail ? esc(v.detail) : "") + (k === 0 && vp ? '<div>' + line(vp, "More info", !!v.detail) + '</div>' : "") + (k === 0 ? visitExtra(false) : ""));
      });
    } else if(r.group === "farm" && r.dropin === true){
      var h = r.places.filter(function(p){ return p.pin && p.role === "home_base"; })[0];
      add("Visit the " + CP.visitWord(r), (h ? line(h, "Farm info") : "Ask them for the address.") + (raw.dropin_hours && !(h && h.hours) ? ' <span class="muted">· ' + esc(raw.dropin_hours.replace(/\s*\((season ending soon|closing for the season soon)\)/i, "")) + '</span>' : "") + visitExtra(h && h.hours));
    }
    if(ch.indexOf("csa") !== -1) add("Join their CSA", "A weekly share of the harvest. " + (site ? "Sign up on " + site + "." : "Contact them to sign up."));
    if(ch.indexOf("farmers_market") !== -1 || markets.length) add("At the farmers market", markets.length ? '<ul class="plain">' + markets.map(function(p){ return '<li>' + line(p) + '</li>'; }).join("") + '</ul>' : "They sell at local farmers markets.");
    var farmHome = r.group === "farm" && r.farmPickup === true && ch.indexOf("online") !== -1 && !pickups.length ? (r.places.filter(function(p){ return p.role === "home_base"; })[0] || {}) : null;
    var farmHomeLi = farmHome ? '<li>Pick up at the ' + CP.visitWord(r) + ', by arrangement' + (farmHome.loc && isVisitable(farmHome) && addr(farmHome) ? ': ' + line(farmHome) : "") + '</li>' : "";
    var pickupList = pickups.length ? '<ul class="plain">' + pickups.map(function(p){ return '<li>' + line(p) + '</li>'; }).join("") + '</ul>' : (farmHome ? '<ul class="plain">' + farmHomeLi + '</ul>' : "");
    var orderOnline = ch.indexOf("online") !== -1, canPickUp = ch.indexOf("pickup") !== -1 || pickups.length || farmHome;
    if(orderOnline && canPickUp) add("Order online", (site ? "Order at " + site : "Order online") + ", then pick it up at one of these places:" + (pickupList || " ask them where.") + orderNote);   // one entry: order first, then pick up
    else if(canPickUp) add("Pick up an order", "Pick up at one of these places:" + (pickupList || " Ask them where.") + orderNote);
    if(orderOnline && !canPickUp) add("Order online", (site ? "Order at " + site + "." : "Ask them how to order.") + orderNote);
    var stores = r.places.filter(function(p){ return p.role === "store"; });
    if(stores.length) add("In local stores", '<ul class="plain">' + stores.map(function(p){ return '<li>' + line(p, "Their store list") + '</li>'; }).join("") + '</ul>');
    else if(ch.indexOf("retail_partners") !== -1) add("In local stores", "You can find their products in some local stores.");
    if(ch.indexOf("wholesale") !== -1) add("Wholesale", ch.length === 1 ? "They sell to restaurants and stores, not to the public." : "They also sell wholesale to restaurants and stores.");
    if(r.group === "outlet"){
      var shop = r.places[0];
      add("Visit the shop", (shop ? line(shop, "Shop info") : "Ask them for the address and hours.")
        + (raw.phone ? '<div>' + phone(raw.phone) + '</div>' : "") + (site ? '<div>' + site + '</div>' : "")
        );
    }
    if(!out.length && r.group === "farm") add("How to buy", "We haven't confirmed how to buy from them yet. " + (raw.phone ? "Call " + phone(raw.phone) + ". " : "") + (site ? "Or see " + site + "." : ""));
    return out;
  }

  // "Phone, hours: confirmed by the project, October 13, 2026" / "Products: from the business's Facebook page"

  function mapLinks(p){
    var g = p.role === "outlet_site" ? ' · <a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent([p.rec.name, p.loc.address, p.loc.city, "CO"].filter(Boolean).join(", "))+'" target="_blank" rel="noopener">Google Maps listing</a>' : '';
    return '<a href="'+CP.directions(p)+'" target="_blank" rel="noopener">Directions</a>' + g;
  }
  function placeItem(p){
    var role = CP.placeLabel(p);
    var hidden = p.loc.precision === "town";
    return '<li class="'+(p.pickup ? "pickup" : "")+'"><div class="role">'+esc(role)+'</div>'
      + (p.title && p.title !== p.loc.address && p.title !== p.loc.city ? '<strong>'+titleHtml(p)+'</strong><br>' : '')
      + (addr(p) ? esc(addr(p)) : (hidden ? esc((p.loc.city || "Colorado") + " (exact address not shared)") : ""))
      + (p.hours ? '<br>'+esc(p.hours) : '')
      + (p.unconfirmed && p.pin ? '<div class="faint">We haven\'t confirmed that they sell here yet.</div>' : '')
      + (p.loc.confirm_url ? '<div class="faint">' + CP.safeLink(p.loc.confirm_url, (p.pickup ? "Pickup info" : "More info")) + '</div>' : '')
      + (p.pin ? '<div style="margin-top:6px">'+mapLinks(p)+'</div>' : '')
      + '</li>';
  }

  CP.loadModel().then(function(M){
    MODEL = M;
    var r = M.bySlug[slug];
    if(!r){ main.innerHTML = '<p style="padding:40px 0">We couldn\'t find that listing. <a href="directory.html">Browse the directory →</a></p>'; return; }
    var raw = r.raw, st = CP.typeStyle(r.cat);
    document.title = r.name + " · Colorado Open Food Web";

    var tag = '<span class="tag" style="color:'+st.color+'">'+esc(CP.catLabel(r.cat))+'</span>';
    var prodChips = r.productGroups.map(function(g, i){
      return '<a class="chip" href="directory.html?product='+encodeURIComponent(g)+'">'+esc(r.productText[i])+'</a>';
    }).join(" ");
    var wl = ways(r);
    var notes = /^not open to the public/i.test(raw.hours_text || "") ? '<div class="notice-box"><strong>Not open to the public.</strong> Use the website to order.</div>' : "";
    var pins = r.places.filter(function(p){ return p.pin; });
    var verified = raw.last_verified ? '<p class="muted" style="font-size:.85rem;font-style:italic;margin:12px 0 0">Data last checked '+esc(CP.fmtDate(raw.last_verified))+'</p>'
      : '';

    var facts = "";
    facts += fact("Phone", phone(raw.phone) + (raw.call_first ? ' <em>(call first)</em>' : ''));
    facts += fact("Email", raw.email ? '<a href="mailto:'+esc(raw.email)+'">'+esc(raw.email)+'</a>' : "");
    facts += fact("Website", raw.website ? CP.safeLink(raw.website) : "");
    facts += fact("Social", [raw.facebook && CP.safeLink(raw.facebook, "Facebook"), raw.instagram && CP.safeLink(raw.instagram, "Instagram")].filter(Boolean).join(" · "));
    if(raw.hours_text && (r.group !== "farm" || !r.places.some(function(p){ return p.hours; }))) facts += fact("Hours", esc(raw.hours_text));
    if(raw.months_open && raw.months_open.length) facts += fact("Season", esc(raw.months_open.length === 12 ? "Year-round" : raw.months_open.join(", ")));
    facts += fact("Also", [raw.accepts_snap && "Accepts SNAP", raw.certified_organic && "Certified organic", raw.ada_accessible && "ADA accessible"].filter(Boolean).map(esc).join(" · "));

    // A market lists its vendors: every business that sells at its location.
    var vendorsHtml = "";
    if(r.group === "market"){
      var mloc = r.places[0] && r.places[0].loc.id;
      var vs = M.recs.filter(function(x){ return x !== r && x.places.some(function(p){ return p.loc.id === mloc; }); })
        .sort(function(a, b){ return a.name.localeCompare(b.name); });
      if(vs.length) vendorsHtml = '<h2 style="font-size:1.25rem;margin-top:24px">Vendors at this market ('+vs.length+')</h2><ul class="plain vendors">'
        + vs.map(function(x){ return '<li><a href="'+CP.recUrl(x)+'">'+esc(x.name)+'</a> <span class="muted">· '+esc([x.homeTown ? "based in " + x.homeTown : "", x.productText.slice(0,3).join(", ")].filter(Boolean).join(" · "))+'</span></li>'; }).join("") + '</ul>';
    }
    // Farms and shops: one section. The map comes first, then each way to get it with its address and links, then any
    // other place that has not been shown yet. Markets and free-food sites keep a plain Location section.
    var unified = r.group === "farm" || r.group === "outlet";
    // A home base with no pin is not somewhere to go (the business has not published it): do not list it as a place.
    var rest = r.places.filter(function(p){ return !used[p.id] && isVisitable(p); });
    var placesSection = '<h2 style="font-size:1.25rem;margin-top:22px">Places to find them</h2>'
      + (pins.length ? '<div id="mini" class="mini-map" role="img" aria-label="Map showing where to find '+esc(r.name)+'"></div>' : '')
      + '<ul class="ways">'+wl.join("")+'</ul>'
      + (rest.length ? '<ul class="places">'+rest.map(placeItem).join("")+'</ul>' : '');
    // Previous / next: the list the visitor was browsing (directory or map results) when this listing is in it, else everything A to Z.
    var order = (CP.browse.get() || []).filter(function(s){ return M.bySlug[s]; });
    if(order.indexOf(slug) === -1) order = M.recs.map(function(x){ return x.slug; }).sort(function(a, b){ return M.bySlug[a].name.localeCompare(M.bySlug[b].name); });
    var at = order.indexOf(slug), prevR = M.bySlug[order[at - 1]], nextR = M.bySlug[order[at + 1]];
    var pager = '<nav class="pager" aria-label="Browse listings">'
      + (prevR ? '<a rel="prev" href="'+CP.recUrl(prevR)+'" aria-label="Previous listing: '+esc(prevR.name)+'">← '+esc(prevR.name)+'</a>' : '<span class="off"></span>')
      + '<span class="pos">'+(at + 1)+' of '+order.length+'</span>'
      + (nextR ? '<a rel="next" href="'+CP.recUrl(nextR)+'" aria-label="Next listing: '+esc(nextR.name)+'">'+esc(nextR.name)+' →</a>' : '<span class="off"></span>')
      + '</nav>';
    main.innerHTML =
      '<nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Map</a> › <a href="directory.html">Directory</a> › '+esc(r.name)+'</nav>' + pager
      + '<div class="provider"><div>'
      +   '<h1>'+esc(r.name)+'</h1><div>'+tag+(r.group === "farm" && r.homeTown ? ' <span class="muted">· Based in '+esc(r.homeTown)+'</span>' : '')+'</div>'
      +   notes
      +   (r.photo ? CP.photoHtml(r, "hero-photo") : "")
      +   (r.description ? '<div class="about">' + r.description.split("\n").map(function(t){ return '<p>' + esc(t) + '</p>'; }).join("") + '</div>' : "")
      +   (unified ? placesSection : (wl.length ? '<h2 style="font-size:1.25rem;margin-top:22px">How to get it</h2><ul class="ways">'+wl.join("")+'</ul>' : ''))
      +   (prodChips || r.products ? '<h2 style="font-size:1.25rem;margin-top:24px">What they offer</h2>' + (prodChips ? '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">'+prodChips+'</div>' : '') + (r.products ? '<p>'+esc(r.products)+'</p>' : '') : '')
      +   (!unified && r.places.length ? '<h2 style="font-size:1.25rem;margin-top:24px">Location</h2>'
      +   (pins.length ? '<div id="mini" class="mini-map" role="img" aria-label="Map showing where to find '+esc(r.name)+'"></div>' : '')
      +   '<ul class="places">'+r.places.filter(isVisitable).map(placeItem).join("")+'</ul>' : '')
      +   vendorsHtml
      +   '<div class="facts">'+facts+'</div>'+verified
      +   '<p style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn btn-ghost" href="'+CP.suggestUrl(r, "Listing update")+'">Suggest an update</a>'
      +   '<a class="btn btn-ghost" href="'+CP.suggestUrl(r, "Remove my listing")+'">Remove this listing</a></p>'
      + '</div></div>';

    if(pins.length){
      var m = L.map("mini", { scrollWheelZoom:false, zoomControl:true });
      CP.basemap(m); CP.countyOutline(m);
      var offs = CP.fanOut(pins), b = [];
      pins.forEach(function(p){
        L.marker([p.lat, p.lng], { icon:CP.pinIcon(p.role === "home_base" && p.kind === "maker" ? "farm" : p.kind, offs[p.id], p.unconfirmed, p.pickup, p.market), title:p.title }).addTo(m)
          .bindPopup('<strong>'+esc(CP.placeLabel(p))+'</strong><br>'+esc(p.title)+(p.hours ? '<br>'+esc(p.hours) : ''));
        b.push([p.lat, p.lng]);
      });
      if(b.length === 1) m.setView(b[0], 12); else m.fitBounds(b, { padding:[30,30], maxZoom:12 });
    }
  }).catch(function(e){ main.innerHTML = '<p style="padding:40px 0">Could not load ('+esc(e.message)+').</p>'; });
})();
</script>
</body>
</html>
