name: Tests

# Runs the unit tests and the integrity checks on the committed data for every pull request, so a data or
# code change shows pass or fail before it is merged. No network calls: email checks read the recorded
# results in inputs/email_verification.csv.

on:
  pull_request:
    branches: [main]
    paths: ["data/**", "inputs/**", "snapshots/**", "scripts/**", "tests/**", "site/**", "sources.json", ".github/workflows/tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/tests.yml
      - run: pip install pytest
      - run: python -m pytest tests scripts/tests -q
