name: Project site

# Publishes site/ to GitHub Pages. The data it shows comes from the latest release, downloaded at build time,
# so a new release refreshes the site on its own.

on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/build_site.py", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "${{ github.repository }}" --pattern "*" -D release
      - name: Build the site data
        run: python scripts/build_site.py --release-dir release
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
