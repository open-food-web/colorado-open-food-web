name: Project site

# Publishes site/ to GitHub Pages (map, directory, supply network, about). The supply network and the downloads come
# from the latest release, downloaded at build time; the map and directory come from the statewide app export built
# from the tables in this repo (docs/EXPORTS.md), so a new release or a merged data change refreshes the site.

on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/build_site.py", "scripts/export_app.py", "exports/open-food-web.config.json", "data/colorado/**", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "${{ github.repository }}" --pattern "*" -D release
      - name: Build the site data
        run: python scripts/build_site.py --release-dir release
      - name: Build the map and directory data (statewide export)
        run: >
          python scripts/export_app.py --tables data/colorado --out site/data/food-web.json
          --release "$(date +%Y-%m)" --statewide --unconfirmed-home-pins hide
          --config exports/open-food-web.config.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
